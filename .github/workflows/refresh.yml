name: Weekly refresh

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Completed Apify run IDs, comma-separated
        required: true
        type: string
      target:
        description: Airtable and Vercel environment
        required: true
        type: choice
        options: [pilot, production]
        default: pilot

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  enrich:
    if: inputs.target == 'pilot' || inputs.target == 'production'
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_ACTOR_ID: pro100chok/semrush-scraper
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      CACHE_INVALIDATION_SECRET: ${{ secrets.CACHE_INVALIDATION_SECRET }}
      RUN_IDS: ${{ inputs.run_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run --silent enrich -- --run-ids "$RUN_IDS" | tee "$RUNNER_TEMP/refresh-report.json"
        shell: bash
      - run: npm run --silent apollo -- export "$RUN_IDS"
      - if: always()
        run: npm run --silent refresh:report -- "$RUNNER_TEMP/refresh-report.json"
